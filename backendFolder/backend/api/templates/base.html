{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base</title>
    <link rel="stylesheet" href="{% static 'css/basestyle.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="w-100 d-flex cstmfullbase-class">
        <div class="cstmwrapper">
            {% include 'partials/sidebar.html' %}
        </div>
        <div class="cstmcontent">
            <div class="w-100 d-flex cstmcontentheader">
                <h1 class="cstmcontentheaderh1tag">Pages / {% block pages_header %}{% endblock %}</h1>
                <div class="headericonandname">
                    <div class="headericonandname">
                        <i class="fa-regular fa-circle-user"></i>
                    {% if user.is_authenticated %}
                        <p>{{ user.username}}</p>
                    {% else %}
                        <p>Guest</p>
                    {% endif %}  
                    </div>
                    <i class="fa-solid fa-align-left" onclick="openSidebar()"></i>                  
                </div>

            </div>
            {% block content %}
            {% endblock %}
        </div>
    </div>

     <div id="sidebaroverlayid" class="sidebaroverlay" ></div>
    <div id="respsidebardivid" class="respsidebardiv" >
        <div class="image_div"></div>
        <hr>
        <h1 class="sidebarh1tag">Pages</h1>
        <a href="/" class="sidebaratag"><i class="fa-solid fa-house"></i>Dashboard</a>
        <a href="/contact" class="sidebaratag"><i class="fa-solid fa-id-card"></i>Contact</a>
        <a href="/event" class="sidebaratag"><i class="fa-solid fa-calendar-days"></i>Events</a>
        <hr>
        <h1 class="sidebarh1tag">Account</h1>
        <!-- <a href="/" class="sidebaratag"><i class="fa-regular fa-circle-user"></i>Profile</a> -->
        <a href="/logout" class="sidebaratag"><i class="fa-solid fa-arrow-right-from-bracket"></i>Log Out</a>
    </div>
</body>
<script src="{% static 'js/basescripts.js' %}"></script>
</html>
