{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

     <div class="loginhomediv">
        <div class="logindiv">
            <div class="image_div_logo"></div>
            <form method="POST" action="" class="formdivcstmlogin">
                {% csrf_token %}
                <h1 class="forgotpasswordh1text">Enter New Password</h1>
                <label for="email" class="labelcstmlogin">Password :</label>
                <div class="passworddiv">
                    {{ form.new_password1 }}
                    <i class="fa-solid fa-eye toggle-eye" id="typePasswordid1"></i>
                </div>

                {% if form.new_password1.errors %}
        <div class="error-message_cstm">{{ form.new_password1.errors.0 }}</div>
    {% endif %}

    <div class="password-strength">
        <div class="bar" id="bar-1"></div>
        <div class="bar" id="bar-2"></div>
        <div class="bar" id="bar-3"></div>
        <div class="bar" id="bar-4"></div>
    </div>                
    <div id="password-error" class="error-message"></div>

    <label class="labelcstmlogin">Confirm Password :</label>
    <div class="passworddiv">
        {{ form.new_password2 }}
        <i class="fa-solid fa-eye toggle-eye" id="typePasswordid2"></i>
    </div>
    {% if form.new_password2.errors %}
        <div class="error-message_cstm">{{ form.new_password2.errors.0 }}</div>
    {% endif %}
            <button type="submit" class="loginbtn">Reset Password</button>
            
            </form>
        </div>
    </div>
</body>
<script src="{% static 'js/signup.js' %}"></script>
</html>
